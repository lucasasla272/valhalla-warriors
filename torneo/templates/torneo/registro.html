{% extends "torneo/base.html" %}
{% block title %}Unirse al torneo | Valhalla Warriors{% endblock %}
{% block content %}
<div class="fondo-epico"></div>
    <div class="card" style="margin: 60px auto 0;">
        <h1>Registro de berserker</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Unirse al torneo</button>
        </form>
        <p style="margin-top:10px"><a href="{% url 'torneo:login' %}">¿Ya tenés cuenta? Entrá al Valhalla</a></p>
    </div>
{% endblock %}
